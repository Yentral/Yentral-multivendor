[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/wire",
    "crates/protocol",
    "crates/audit",
    "crates/directory",
    "crates/p2p",
    "crates/chat",
    "crates/cli",
]
# `desktop/` contains a Tauri 2 shell that wraps `phantom-chat`. It is
# intentionally kept OUT of the workspace because the Tauri build requires
# webkit2gtk-4.1 + libsoup-3.0 on Linux, which may not be installed on every
# machine. Build it explicitly: `cd desktop && cargo tauri dev`.
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/yentral/yentral-multivendor"
authors = ["PHANTOM Protocol contributors"]

[workspace.dependencies]
# Classical crypto
ed25519-dalek    = { version = "2", features = ["rand_core"] }
x25519-dalek     = { version = "2", features = ["static_secrets"] }

# Post-quantum crypto (NIST FIPS 203 ML-KEM, FIPS 204 ML-DSA)
# RustCrypto pure-Rust implementations with explicit RNG seeding.
ml-kem           = "0.2"
ml-dsa           = "0.0.4"
signature        = "2"

# AEAD + KDF + hashing
chacha20poly1305 = "0.10"
blake3           = "1"
hkdf             = "0.12"
sha2             = "0.10"

# BIP39 mnemonic
bip39            = { version = "2", features = ["rand"] }

# Misc
rand             = "0.8"
rand_core        = "0.6"
rand_chacha      = "0.3"
zeroize          = { version = "1", features = ["derive"] }
thiserror        = "1"
hex              = "0.4"
serde            = { version = "1", features = ["derive"] }
bincode          = "1"

# CLI
clap             = { version = "4", features = ["derive"] }

# P2P
libp2p = { version = "0.54", features = [
    "tcp", "noise", "yamux",
    "kad", "mdns", "request-response", "cbor",
    "tokio", "macros",
]}
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
futures         = "0.3"
tracing         = "0.1"

# Internal crates
phantom-crypto    = { path = "crates/crypto" }
phantom-wire      = { path = "crates/wire" }
phantom-protocol  = { path = "crates/protocol" }
phantom-audit     = { path = "crates/audit" }
phantom-directory = { path = "crates/directory" }
phantom-p2p       = { path = "crates/p2p" }
phantom-chat      = { path = "crates/chat" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
