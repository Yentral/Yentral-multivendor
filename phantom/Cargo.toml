[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/wire",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/yentral/yentral-multivendor"
authors = ["PHANTOM Protocol contributors"]

[workspace.dependencies]
# Classical crypto
ed25519-dalek    = { version = "2", features = ["rand_core"] }
x25519-dalek     = { version = "2", features = ["static_secrets"] }

# Post-quantum crypto (NIST FIPS 203 ML-KEM, FIPS 204 ML-DSA)
# RustCrypto pure-Rust implementations with explicit RNG seeding.
ml-kem           = "0.2"
ml-dsa           = "0.0.4"
signature        = "2"

# Symmetric + KDF + hashing
chacha20poly1305 = "0.10"
blake3           = "1"
hkdf             = "0.12"
sha2             = "0.10"
argon2           = "0.5"

# BIP39 mnemonic
bip39            = { version = "2", features = ["rand"] }

# Misc
rand             = "0.8"
rand_core        = "0.6"
rand_chacha      = "0.3"
zeroize          = { version = "1", features = ["derive"] }
subtle           = "2"
thiserror        = "1"
hex              = "0.4"
serde            = { version = "1", features = ["derive"] }
bincode          = "1"

# CLI
clap             = { version = "4", features = ["derive"] }

# Internal crates
phantom-crypto   = { path = "crates/crypto" }
phantom-wire     = { path = "crates/wire" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
