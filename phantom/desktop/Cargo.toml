[package]
name = "phantom-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "PHANTOM Protocol — Tauri 2 desktop GUI shell wrapping phantom-chat."

# Not a workspace member — see phantom/Cargo.toml's `exclude = ["desktop"]`.
# Build requires webkit2gtk-4.1 + libsoup-3.0 on Linux. Run:
#
#   cd phantom/desktop && cargo tauri dev
#
# …on a machine where those system packages are installed.

[[bin]]
name = "phantom-desktop"
path = "src/main.rs"

[dependencies]
tauri         = { version = "2", features = [] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tokio         = { version = "1", features = ["full"] }
libp2p        = { version = "0.54", default-features = false }

# Re-use the workspace crates via relative paths.
phantom-chat     = { path = "../crates/chat" }
phantom-crypto   = { path = "../crates/crypto" }
phantom-protocol = { path = "../crates/protocol" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
